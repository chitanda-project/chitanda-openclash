name: Verify Chitanda Core Channel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'luci-app-openclash/root/usr/share/openclash/openclash_core.sh'
      - 'luci-app-openclash/root/usr/share/openclash/openclash_version.lua'
      - '.github/workflows/chitanda-core-verify.yml'

permissions:
  contents: read

jobs:
  verify-amd64-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate updater syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          bash -n luci-app-openclash/root/usr/share/openclash/openclash_core.sh
          luac5.1 -p luci-app-openclash/root/usr/share/openclash/openclash_version.lua

      - name: Download and execute the Chitanda Meta core
        run: |
          version_url=https://raw.githubusercontent.com/chitanda-project/chitanda/main/releases/mihomo/version.txt
          version=$(curl -fsSL "$version_url")
          test "$version" = "$(printf '%s' "$version" | tr -d '\r\n')"
          test "$version" != ""
          asset_url="https://github.com/chitanda-project/chitanda/releases/download/${version}/clash-linux-amd64-v1.tar.gz"
          curl -fsSL "$asset_url" -o core.tar.gz
          tar -tzf core.tar.gz | grep -x clash
          mkdir core
          tar -xzf core.tar.gz -C core
          chmod 755 core/clash
          core/clash -v | grep -F "Mihomo Meta ${version}"
